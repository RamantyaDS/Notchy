name: Build & Release Executable

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type check & Unit tests
        run: |
          npm run check
          npm run test

      - name: Build Tauri Application (.exe)
        shell: pwsh
        run: |
          npx @tauri-apps/cli build --bundles nsis -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notchy-Windows-x64-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
