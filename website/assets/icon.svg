<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Windows Fluent Background Gradient -->
    <linearGradient id="bg_grad" x1="160" y1="80" x2="864" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#1D4ED8"/>
      <stop offset="85%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Outer Squircle Bevel Stroke -->
    <linearGradient id="stroke_grad" x1="512" y1="64" x2="512" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Center Bloom / Ambient Glow to enhance contrast with the black notch -->
    <radialGradient id="bloom_light" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>

    <!-- Notch Surface: Jet Black with high definition -->
    <linearGradient id="notch_surface" x1="512" y1="310" x2="512" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1318"/>
      <stop offset="30%" stop-color="#07090C"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Notch Rim Light -->
    <linearGradient id="notch_rim" x1="512" y1="310" x2="512" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>

    <!-- Eyes Glow Filter -->
    <filter id="eye_glow" x="280" y="320" width="464" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow for Island Floating Effect -->
    <filter id="notch_shadow" x="72" y="240" width="880" height="540" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#020617" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Squircle Canvas with Vibrant Contrast Background -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg_grad)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bloom_light)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" stroke="url(#stroke_grad)" stroke-width="3"/>

  <!-- The Notch Pill Island (Jet Black against vibrant blue/indigo) -->
  <g filter="url(#notch_shadow)">
    <rect x="172" y="320" width="680" height="340" rx="170" fill="url(#notch_surface)"/>
    <rect x="172" y="320" width="680" height="340" rx="170" stroke="url(#notch_rim)" stroke-width="3"/>
  </g>

  <!-- Top Glass Highlight Reflection on the Notch -->
  <path d="M260 365 C340 345, 684 345, 764 365" stroke="rgba(255, 255, 255, 0.28)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Mascot Eyes with Glow -->
  <g filter="url(#eye_glow)">
    <!-- Left Eye (Glowing White Capsule) -->
    <rect x="408" y="420" width="76" height="136" rx="38" fill="#FFFFFF"/>
    
    <!-- Right Eye (Glowing White Capsule) -->
    <rect x="540" y="420" width="76" height="136" rx="38" fill="#FFFFFF"/>
  </g>

  <!-- Eye Inner Luster / Cute Highlights -->
  <ellipse cx="432" cy="455" rx="12" ry="18" fill="rgba(255, 255, 255, 0.95)"/>
  <ellipse cx="564" cy="455" rx="12" ry="18" fill="rgba(255, 255, 255, 0.95)"/>
</svg>
